<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP: same policy as the other windows ('unsafe-eval' is only for webpack's dev build) -->
    <meta
          http-equiv="Content-Security-Policy"
          content="default-src 'self';
          script-src 'self' 'unsafe-eval';
          style-src 'self' 'unsafe-inline';"
    />
    <title>Task Detail</title>
  </head>
  <body>

    <div class="app">
      <header class="modal-header">
        <h2>Task Detail</h2>
      </header>

      <main class="detail-body">
        <!-- Shown when the task can't be found -->
        <p id="detail-error" class="detail-error" hidden>Task not found.</p>

        <!-- Read-only fields, filled in by detail.js -->
        <dl id="detail-list" class="detail-list" hidden>
          <div class="detail-row"><dt>ID</dt><dd id="detail-id"></dd></div>
          <div class="detail-row"><dt>Title</dt><dd id="detail-title"></dd></div>
          <div class="detail-row"><dt>Priority</dt><dd id="detail-priority"></dd></div>
          <div class="detail-row"><dt>Status</dt><dd id="detail-status"></dd></div>
          <div class="detail-row"><dt>Created</dt><dd id="detail-created"></dd></div>
          <div class="detail-row"><dt>Last Updated</dt><dd id="detail-updated"></dd></div>
                    <div class="detail-row">
            <dt>Notes</dt>
            <dd>
              <!-- Normal view: the notes text with an Edit button beside it -->
              <div id="notes-view" class="notes-view">
                <span id="detail-notes"></span>
                <button type="button" id="btn-edit-notes" class="btn-secondary btn-small">Edit</button>
              </div>

              <!-- Edit view: shown only after clicking Edit -->
              <div id="notes-editor" class="notes-editor" hidden>
                <textarea id="notes-input" rows="5" maxlength="500"></textarea>
                <span class="field-error" id="notes-error" hidden>Could not save the notes.</span>
                <div class="notes-buttons">
                  <button type="button" id="btn-cancel-notes" class="btn-secondary">Cancel</button>
                  <button type="button" id="btn-save-notes" class="btn-primary">Save</button>
                </div>
              </div>
            </dd>
          </div>
        </dl>
      </main>

      <div class="form-actions detail-actions">
        <button type="button" id="btn-close" class="btn-secondary">Close</button>
      </div>
    </div>

  </body>
</html>
