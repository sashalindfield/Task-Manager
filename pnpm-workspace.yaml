# Node modules layout required by Electron Forge
nodeLinker: hoisted
# Block lifecycle scripts by default
ignoreScripts: true
# Delay installs of packages < 24 hours old
minimumReleaseAge: 1440
# Block trust regressions
trustPolicy: no-downgrade
# Disable exotic subdep blocking (default: true)
# @electron/node-gyp uses a GitHub tarball
blockExoticSubdeps: false
# Build script allow-list (pnpm 12 uses a map)
# onlyBuiltDependencies was removed in pnpm 11
allowBuilds:
  electron: true
  "@electron/rebuild": true
# Force patched versions for known toolchain
# vulnerabilities in @electron-forge
overrides:
  tar: ">=7.5.21"
  webpack-dev-server: ">=5.2.6"
  qs: ">=6.16.0"
  tmp: ">=0.2.6"
  semver: ">=7.7.3"
  undici-types: ">=6.21.0"